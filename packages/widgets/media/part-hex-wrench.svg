<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Pair of L-shaped hex wrenches with the hexagonal tip shown end-on, used to free a jammed disposal">
<title>Pair of L-shaped hex wrenches with the hexagonal tip shown end-on, used to free a jammed disposal</title>
<defs>
<style>
.l{fill:none;stroke:#EEF1EA;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.t{fill:none;stroke:#EEF1EA;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.m{fill:none;stroke:#D5DCD3;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.d{fill:none;stroke:#5D6A63;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s{fill:#16231F}
.o{fill:#16231F;stroke:#EEF1EA;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.om{fill:#16231F;stroke:#D5DCD3;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.od{fill:#16231F;stroke:#5D6A63;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.h1{fill:url(#h1);stroke:none}
.h2{fill:url(#h2);stroke:none}
.h3{fill:url(#h3);stroke:none}
.dots{fill:url(#dots);stroke:none}
.red{fill:#E2563F;stroke:#EEF1EA;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.redl{fill:none;stroke:#D5DCD3;stroke-width:2;stroke-linecap:round}
.paper{fill:#D5DCD3;stroke:#EEF1EA;stroke-width:2.2;stroke-linejoin:round}
.tx{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;fill:#D5DCD3;letter-spacing:.04em}
.ink{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;fill:#16231F;letter-spacing:.04em}
.gx{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;fill:#5D6A63;letter-spacing:.06em}
</style>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#6F8DA6" stroke-width="1.5"/></pattern>
<pattern id="h1" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V9" stroke="#5D6A63" stroke-width="1.6"/></pattern>
<pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#5D6A63" stroke-width="1.8"/></pattern>
<pattern id="h3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><path d="M0 0V6" stroke="#5D6A63" stroke-width="1.6"/></pattern>
<pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#5D6A63"/><circle cx="9" cy="9" r="1.3" fill="#5D6A63"/></pattern>
</defs>
<rect width="600" height="600" fill="#16231F"/>
<rect width="600" height="600" fill="url(#grid)" opacity=".08"/>
<path d="M210 90V430Q210 480 260 480H500" fill="none" stroke="#EEF1EA" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 90V430Q210 480 260 480H500" fill="none" stroke="#16231F" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 90V430Q210 480 260 480H500" fill="none" stroke="#D5DCD3" stroke-width="2"/><path d="M220 96V430Q220 470 258 470H494" fill="none" stroke="url(#h2)" stroke-width="9"/><path d="M290 190V380Q290 420 330 420H450" fill="none" stroke="#EEF1EA" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 190V380Q290 420 330 420H450" fill="none" stroke="#16231F" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 190V380Q290 420 330 420H450" fill="none" stroke="#D5DCD3" stroke-width="2"/><path d="M297 196V380Q297 412 328 412H446" fill="none" stroke="url(#h2)" stroke-width="7"/><path d="M482 210L430 240L378 210L378 150L430 120L482 150Z" class="o"/><path d="M461.2 198L430 216L398.8 198L398.8 162L430 144L461.2 162Z" class="od"/><path d="M370 262H490M370 256V268M490 256V268" class="m"/><text x="386" y="296" font-size="22" class="tx" font-weight="700">1/4 in</text><path d="M226 90L372 150" class="d" stroke-dasharray="3 8"/>
</svg>
